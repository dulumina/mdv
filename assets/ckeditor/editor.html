<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link rel="stylesheet" href="ckeditor5.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
  #editor, #editor > .ck.ck-editor { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ck.ck-editor__top { flex: 0 0 auto; }
  .ck.ck-editor__main { flex: 1; min-height: 0; overflow: auto; }
  .ck.ck-editor__editable { box-sizing: border-box; width: 100%; max-width: 980px; margin: 0 auto;
    padding: 24px 40px 64px; border: 0 !important; }
  .ck.ck-editor__editable_inline > :first-child { margin-top: 0; }
  body.dark { background: #0d1117; color: #f0f6fc; }
  body.dark .ck.ck-editor__editable_inline { background: #0d1117; color: #f0f6fc; }
  body.dark .ck.ck-toolbar, body.dark .ck.ck-toolbar .ck-button { background: #161b22; border-color: #30363d; color: #f0f6fc; }
  body.dark .ck.ck-toolbar .ck-button:hover, body.dark .ck.ck-toolbar .ck-button.ck-on { background: #21262d; }
  body.dark .ck.ck-dropdown__panel { background: #161b22; border-color: #30363d; }
</style></head>
<body><div id="editor"></div>
<script src="ckeditor5.umd.js"></script>
<script src="editor.js"></script>
</body></html>
